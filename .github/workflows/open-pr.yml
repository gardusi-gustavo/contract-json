name: open-pr
on:
  push:
    branches: [pr-bot]
permissions:
  contents: read
  pull-requests: write
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head chore/linear --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists"
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base main --head chore/linear \
            --title "Apply tokenless docs, workflow retirement, and event callers" \
            --body "Tokenless docs, workflow retirement, event callers, and Dependabot removal. Prepared for review."
